<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#noteGrad)" stroke-width="8" opacity="0.3" />

  <!-- Music Note Graphic -->
  <g filter="url(#glow)">
    <path d="M 340 120 L 220 155 L 220 330 C 205 320 180 320 160 332 C 132 349 125 385 145 408 C 165 430 205 430 230 408 C 245 394 252 372 250 350 L 250 215 L 340 188 L 340 270 C 325 260 300 260 280 272 C 252 289 245 325 265 348 C 285 370 325 370 350 348 C 365 334 372 312 370 290 L 370 150 C 370 132 355 118 340 120 Z" fill="url(#noteGrad)" />
  </g>
</svg>
